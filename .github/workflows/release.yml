# =============================================================================
# Release — 构建 linux x64 / arm64 并发布 GitHub Release
#
#   触发方式:
#     1. 手动打 tag:  git tag velodb-mcp-server-0.3.0 && git push origin velodb-mcp-server-0.3.0
#     2. Actions 页面手动触发（需填版本号）
#
#   产物:  velodb-mcp-server-<version>-linux_x64.tar.gz
#         velodb-mcp-server-<version>-linux_arm64.tar.gz
#
#   说明:  私有仓库无免费 ARM runner，linux-arm64 在 x64 runner 上通过
#         build.sh 自带的交叉构建完成（pip --platform 解压 wheel）。
#         仓库转公开后可将 arm64 的 runner 换成 ubuntu-24.04-arm 原生构建。
# =============================================================================
name: Release

on:
  push:
    tags: ["velodb-mcp-server-*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.3.0，不带前缀）"
        required: true
        default: "0.3.0"

jobs:
  # ── 计算本次发布的版本号 ─────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Actions 页面手动触发：版本号直接取输入
            V="${{ inputs.version }}"
            git fetch origin --tags --force >/dev/null 2>&1 || true
            if git rev-parse "velodb-mcp-server-$V" >/dev/null 2>&1; then
              echo "::error::Tag velodb-mcp-server-$V already exists"
              exit 1
            fi
          else
            # tag 推送：velodb-mcp-server-0.3.0 → 0.3.0
            V="${GITHUB_REF_NAME#velodb-mcp-server-}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  # ── 构建（x64 原生 + arm64 交叉） ────────────────────────────────────
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.platform }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./build.sh ${{ matrix.platform }}

      - name: Rename release package
        run: |
          for package in dist/doris-mcp-server-*.tar.gz; do
            mv "$package" "${package/doris-mcp-server/velodb-mcp-server}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: velodb-mcp-server-${{ needs.version.outputs.version }}-${{ matrix.platform }}
          # build.sh 产物文件名使用下划线平台名（linux_x64 / linux_arm64），
          # 每个 matrix job 只构建一个平台，dist/ 下仅一个包。
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── 打 tag + 发布 Release ────────────────────────────────────────────
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: velodb-mcp-server-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # tag 不存在时自动在当前 commit 上创建
          tag_name: velodb-mcp-server-${{ needs.version.outputs.version }}
          name: velodb-mcp-server-${{ needs.version.outputs.version }}
          files: dist/*.tar.gz
          body: ""
